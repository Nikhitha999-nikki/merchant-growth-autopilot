services:
  mysql:
    image: mysql:8.4
    container_name: merchant-growth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-merchant_growth}
      MYSQL_USER: ${MYSQL_USER:-merchant_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-merchant_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
