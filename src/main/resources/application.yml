spring:
  application:
    name: merchant-growth-autopilot

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/merchant_growth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${DB_USERNAME:${MYSQL_USER:merchant_admin}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:merchant_dev_password}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
